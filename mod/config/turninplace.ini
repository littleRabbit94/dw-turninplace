; DWTurnInPlace settings. Saved changes apply in game within a second; toggle_key applies at the next start.
; Keys this game leaves unbound: H K N O U V Y. P, F5 and F9 are used by the game.
; DWFreeCam uses F6 F7 H, DWTimeOfDay U Y H K, DWSmoothwalker V.

[TurnInPlace]
enabled = true
turn_angle = 50        ; degrees between camera and facing before a turn (clamp 46..170)
settle_speed = 30      ; camera turning slower than this, in degrees per second, counts as settled (clamp 1..720)
settle_time = 0.3      ; seconds settled before a turn starts (clamp 0..3)
chain_turns = true     ; keep turning while the camera keeps moving
toggle_key =           ; F1-F12 or a letter/digit; blank = unbound
log_level = normal     ; normal: load, errors, toggle; verbose: every push and pop with reason, offset, flags
