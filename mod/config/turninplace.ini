; Saved changes (or Apply in the Mod Menu) apply in game within a second; toggle_key applies at the next start.
; Keys this game leaves unbound: H K N O U V Y. P, F5 and F9 are used by the game.
; DWFreeCam uses F6 F7 H, DWTimeOfDay U Y H K, DWSmoothwalker V.

[TurnInPlace]
enabled = 1            ; master switch (1/0, true/false)
turn_angle = 60        ; degrees between camera and facing before a turn (clamp 46..170)
settle_speed = 60      ; camera turning slower than this, in degrees per second, counts as settled (clamp 5..180)
cancel_speed = 180     ; a camera swinging faster than this, in degrees per second, stops a turn (clamp 30..360)
settle_time = 0.35     ; seconds settled before a turn starts (clamp 0..2)
chain_turns = 1        ; keep turning while the camera pans slowly (1/0, true/false)
toggle_key =           ; F1-F12 or a letter/digit; blank = unbound
verbose_log = 0        ; 0: load, errors, toggle; 1: every push and pop with reason, offset, flags
