; Settings page for the Dawnwalker Mod Menu (Nexus 271). The menu reads this file once per game session.
; Apply rewrites the matching numbers in config/turninplace.ini, and the mod picks the change up within a
; second: no callback needed.
;
; Only numeric keys can go here, so toggle_key is missing. Every ConfigKey below must exist exactly once in
; turninplace.ini with a value inside its range, or the whole page fails to open. The mod adds missing keys
; to that file at startup.

[Mod]
Id = DWTurnInPlace
Name = Turn In Place
Author = littleRabbit6
Version = 0.2.2
Description = When you stand still and swing the camera away, your character turns on the spot to face it with the game's own turn animations. Moving off always starts a normal walk or run. Changes apply as soon as you press Apply.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Turn In Place
Description = On: standing still, your character turns to face the camera once it has swung far enough and stopped. Off: the game's own behaviour, where only the head follows the camera.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = enabled

[Category.Turning]
VisibleWhen = enabled
VisibleValues = 1

[Setting.turn_angle]
Id = turn_angle
Type = slider
Label = Turn angle
Description = How far the camera has to be from where your character faces before a turn. The head follows the camera up to 60 degrees, so a value under 60 turns the body before the head runs out of room.
Group = Turning
Minimum = 46
Maximum = 170
Step = 1
Decimals = 0
Suffix = °
Default = 60
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = turn_angle

[Setting.settle_time]
Id = settle_time
Type = slider
Label = Wait after the camera stops
Description = Seconds the camera has to hold still before a turn starts. Longer waits make quick glances around turn nothing; shorter waits turn sooner. Moving off before the wait ends never turns.
Group = Turning
Minimum = 0
Maximum = 2
Step = 0.05
Decimals = 2
Suffix =  s
Default = 0.35
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = settle_time

[Setting.settle_speed]
Id = settle_speed
Type = slider
Label = Camera counts as stopped below
Description = A camera turning slower than this counts as stopped, so a slow drift still lets a turn start. A faster swing (see below) stops a turn in progress. Lower it if slow camera movement starts turns you did not want.
Group = Turning
Minimum = 5
Maximum = 180
Step = 5
Decimals = 0
Suffix = °/s
Default = 60
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = settle_speed

[Setting.cancel_speed]
Id = cancel_speed
Type = slider
Label = Swing that stops a turn
Description = A camera swinging faster than this stops the turn in progress, and the next one waits again. Slower camera movement keeps your character turning with it. Raise it to follow faster pans; lower it so a gentler swing cancels. Never counts below the stopped speed above.
Group = Turning
Minimum = 30
Maximum = 360
Step = 10
Decimals = 0
Suffix = °/s
Default = 180
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = cancel_speed

[Setting.chain_turns]
Id = chain_turns
Type = toggle
Label = Keep turning while panning
Description = On: while you stand still and pan the camera slowly, your character keeps turning to follow it. Off: one turn per camera stop. A swing faster than the speed above stops the current turn, and the next one waits again.
Group = Turning
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = chain_turns

[Setting.verbose_log]
Id = verbose_log
Type = toggle
Label = Detailed log
Description = On: UE4SS.log gets a line for every turn, with why it started and ended. For reporting problems. Off: only loading and errors.
Group = Debug
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config/turninplace.ini
ConfigSection = TurnInPlace
ConfigKey = verbose_log
